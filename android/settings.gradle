rootProject.name = 'MindCotine'

include ':react-native-utils-scale'
project(':react-native-utils-scale').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-utils-scale/android')

def resolveNodeModuleDir(String packageName) {
    try {
        def path = ["node", "--print", "require.resolve('${packageName}/package.json')"].execute(null, rootDir).text.trim()
        if (path) {
            return new File(path).getParentFile()
        }
    } catch (Exception ignored) {
        println("[settings.gradle] Could not resolve package '${packageName}': ${ignored.message}")
    }
    return null
}

def expoPackageDir = resolveNodeModuleDir('expo')
if (expoPackageDir) {
    apply from: new File(expoPackageDir, "../scripts/autolinking.gradle")
    useExpoModules()
}

def cliAndroidDir = resolveNodeModuleDir('@react-native-community/cli-platform-android')
if (cliAndroidDir) {
    apply from: new File(cliAndroidDir, "../native_modules.gradle")
    applyNativeModulesSettingsGradle(settings)
}

include ':app'
