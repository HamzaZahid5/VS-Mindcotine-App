apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"
apply plugin: "kotlin-android"
apply plugin: "kotlin-parcelize"
 
project.ext.react = [
    enableHermes: (findProperty('expo.jsEngine') ?: "jsc") == "hermes",
    cliPath: "$rootDir/../node_modules/react-native/cli.js",
    hermesCommand: "$rootDir/../node_modules/hermes-engine/%OS-BIN%/hermesc",
    composeSourceMapsPath: "$rootDir/../node_modules/react-native/scripts/compose-source-maps.js",
]
 
apply from: "../../node_modules/react-native/react.gradle"
apply from: "../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"
applyNativeModulesAppBuildGradle(project)
 
def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
 
android {
    namespace "com.habitfly.mindcotine"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.habitfly.mindcotine"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildFeatures {
        viewBinding = true
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                "**/libc++_shared.so",
                "**/libfbjni.so",
                "**/libhermes.so",
                "**/libjsc.so"
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"  // From node_modules
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.multidex:multidex:2.0.1"
    // Force ExoPlayer versions resolvable from Maven Central
    implementation "com.google.android.exoplayer:exoplayer:2.13.3"
    implementation "com.google.android.exoplayer:extension-okhttp:2.13.3"
    implementation project(':android-scalablevideoview')
    // Firebase
    implementation "com.google.firebase:firebase-analytics:21.5.0"
    implementation "com.google.firebase:firebase-crashlytics:18.6.2"
 
    // Intercom
    implementation 'io.intercom.android:intercom-sdk-base:14.+'
    implementation 'io.intercom.android:intercom-sdk-fcm:14.+'
    implementation project(':react-native-utils-scale')
    // implementation 'com.reactnative:webview:11.0.0'
 
    if (project.ext.react.get("enableHermes", false)) {
        implementation files("$rootDir/../node_modules/hermes-engine/android/hermes-release.aar")
    } else {
        implementation jscFlavor
    }
}
 
afterEvaluate {
    tasks.whenTaskAdded { task ->
        if (task.name == 'installDebug' || task.name == 'installRelease') {
            task.doLast {
                try {
                    def adb = android.getAdbExe().toString()
                    exec {
                        commandLine adb, 'reverse', 'tcp:8081', 'tcp:8081'
                    }
                    exec {
                        commandLine adb, 'reverse', 'tcp:9090', 'tcp:9090'
                    }
                } catch (Exception ignored) {
                    println("ADB reverse failed: " + ignored.message)
                }
            }
        }
    }
}
 
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
