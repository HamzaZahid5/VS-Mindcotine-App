// Top-level build file where you can add configuration options common to all sub-projects/modules.
 
buildscript {
    ext {
        buildToolsVersion = "30.0.3"
        minSdkVersion = 23
        compileSdkVersion = 31
        targetSdkVersion = 31
        kotlinVersion = '1.5.31'
    }
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jcenter.bintray.com' }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://expo.github.io/maven' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:4.2.2")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.gms:google-services:4.3.10'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


def resolveReactNativeVersion() {
    try {
        def version = ['node', '--print', "JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim()
        if (version) {
            return version
        }
    } catch (Exception ignored) {
        println("[build.gradle] Falling back to default React Native version: " + ignored.message)
    }
    return '0.64.3'
}

def REACT_NATIVE_VERSION = resolveReactNativeVersion()
 
allprojects {
    configurations.all {
        resolutionStrategy {
            force "com.facebook.react:react-native:" + REACT_NATIVE_VERSION
            force 'com.google.guava:guava:31.1-android'
            dependencySubstitution {
                substitute module('com.yqritc:android-scalablevideoview') with project(':android-scalablevideoview')
                // Replace legacy artifact no longer available on JCenter with the current one on Maven Central
                substitute module('com.eightbitlab:blurview') with module('com.github.Dimezis:BlurView:version-2.0.5')
            }
            eachDependency { details ->
                if (details.requested.group == 'com.google.android.exoplayer') {
                    details.useVersion '2.13.3'
                }
            }
        }
    }
 
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../android"))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(["node", "--print", "require.resolve('jsc-android/package.json')"].execute(null, rootDir).text.trim(), "../dist"))
        }
        maven {
            url "https://sdk.smartlook.com/android/release"
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url "https://expo.github.io/maven" }
        // Explicit mirrors in case defaults fail to resolve legacy artifacts
        maven { url 'https://repo1.maven.org/maven2' }
        maven { url 'https://maven.google.com' }
        // ExoPlayer legacy artifacts for expo-av
        maven { url 'https://dl.google.com/exo-player/maven/' }
        maven { url 'https://jcenter.bintray.com' }
        maven { url 'https://jitpack.io' }
        jcenter()
        maven {
            // All of Detox' artifacts are provided via the npm module
            url "$rootDir/../node_modules/detox/Detox-android"
        }
    }
}

// Ensure compile/target/min SDK are set for subprojects like :expo
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty('android')) {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null) {
                androidExt.compileSdkVersion = rootProject.ext.compileSdkVersion
                if (androidExt.hasProperty('defaultConfig')) {
                    androidExt.defaultConfig.minSdkVersion rootProject.ext.minSdkVersion
                    androidExt.defaultConfig.targetSdkVersion rootProject.ext.targetSdkVersion
                }
            }
        }
    }
}
 
